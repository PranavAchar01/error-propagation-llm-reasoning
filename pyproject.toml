[project]
name = "error-propagation-llm-reasoning"
version = "0.1.0"
description = "Does forcing verifiable intermediate steps reduce error propagation in multi-step LLM reasoning?"
readme = "README.md"
requires-python = "==3.12.*"

dependencies = [
    "anthropic==0.120.2",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "pandas==3.0.5",
    "statsmodels==0.14.6",
    "matplotlib==3.11.1",
    "tqdm==4.70.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
